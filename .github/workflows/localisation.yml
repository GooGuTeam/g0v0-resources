name: Localisation check

# Cross-checks this repository's .resx files against the *Strings.cs classes in the g0v0! repository
# and publishes the findings to Security -> Code scanning.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localisation:
    uses: g0v0-team/g0v0-l10n-checker/.github/workflows/localisation-check.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      osu-repository: g0v0-team/g0v0
      # Currently targeted at the development branch.
      osu-ref: v2
      # The commit under test, and the one ref in this file that cannot be left out. Left empty, the
      # workflow derives the tag `v<version>-g0v0` from G0V0ResourcesVersion on the osu! side — which
      # names the *published* resources, not the ones under review, i.e. the opposite of what a check
      # on this repository is for. On a fork's pull request ${{ github.sha }} is the merge commit,
      # which lives in this repository, so it still checks out.
      resources-ref: ${{ github.sha }}
      sarif-source: resources
